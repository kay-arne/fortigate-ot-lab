<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inloggen - FortiGate OT Lab</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M16 12v4"/><path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M17 6a2 2 0 0 1 1.414.586l3 3A2 2 0 0 1 22 11v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 .586-1.414l3-3A2 2 0 0 1 7 6z"/><path d="M2 14h20"/><path d="M8 12v4"/></svg></span><h1>FortiGate OT Lab</h1></div>
    <p class="help">Log in op de lab-controller.</p>
    <!--ERROR-->
    <div class="field">
      <label for="username">Gebruikersnaam</label>
      <input id="username" name="username" value="admin" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Wachtwoord</label>
      <div class="secret">
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button class="eye" type="button" title="Tonen/verbergen"
          onclick="const i=document.getElementById('password');i.type=i.type==='password'?'text':'password';this.classList.toggle('open')"></button>
      </div>
      <div class="hint">Het wachtwoord staat in de uitvoer van de installer en in de controller:
        <code>/opt/otlab/data/ui_password</code>.</div>
    </div>
    <button class="primary login-submit" type="submit">Inloggen</button>
  </form>
</body>
</html>
