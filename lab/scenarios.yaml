# Validatietests voor het testcenter.
#
# Elke test draait een 'otprobe'-commando op een node in het lab (probe of
# device) en vergelijkt de uitkomst met de verwachting:
#   expect: allowed  -> de actie moet slagen
#   expect: blocked  -> de FortiGate moet de actie tegenhouden
# Daarna haalt de controller de FortiGate-logs (traffic / app-ctrl / ips) op
# voor het bron-IP, zodat je ziet *welke* policy of signature ingreep.
#
# Met 'check:' voert de controller zelf de test uit in plaats van otprobe
# (inloggen via de VIP, de asset-lijst controleren). 'manual: true' slaat
# 'Alle tests draaien' over: zo'n demo wijzigt tijdelijk de FortiGate-config.

scenarios:
  # --- Segmentatie (IEC 62443 zones & conduits) ---------------------------
  - id: it-to-plc
    group: Segmentatie
    title: "IT/testcenter leest direct een PLC uit"
    from: probe-test
    run: "modbus-read 10.10.0.10 0 4"
    expect: blocked
    why: "Geen conduit van IT naar L1; implicit deny moet loggen."
    logs: [traffic/forward]

  - id: recon-scan
    group: Segmentatie
    title: "Netwerkscan vanaf IT richting L1 (502/102/4840)"
    from: probe-test
    run: "scan 10.10.0.0/24 102,502,4840"
    timeout: 300
    expect: blocked
    why: "Vanaf IT mogen geen OT-services zichtbaar zijn."
    logs: [traffic/forward]

  - id: remote-access
    group: Segmentatie
    title: "Remote access via DMZ jump host"
    from: probe-test
    run: "tcp 10.35.0.10 22"
    expect: allowed
    why: "Toegestaan conduit: IT -> L3.5 jump host (SSH)."
    logs: [traffic/forward]

  - id: dmz-bypass
    group: Segmentatie
    title: "DMZ-host probeert L1 direct te bereiken"
    from: probe-dmz
    run: "modbus-read 10.10.0.10 0 4"
    expect: blocked
    why: "De DMZ termineert; geen doorsteek naar control."
    logs: [traffic/forward]

  - id: l1-to-l3
    group: Segmentatie
    title: "Lateral movement: PLC-segment naar historian"
    from: probe-ctl
    run: "tcp 10.30.0.10 8080"
    expect: blocked
    why: "L1 initieert geen verbindingen naar L3."
    logs: [traffic/forward]

  - id: l2-to-l0
    group: Segmentatie
    title: "Willekeurige L2-host naar field I/O"
    from: probe-sup
    run: "modbus-read 10.0.0.10 0 2"
    expect: blocked
    why: "Alleen PLC's en de EWS praten met L0."
    logs: [traffic/forward]

  # --- Remote access via de DMZ (hoofdstuk 3) ----------------------------
  - id: contractor-login
    group: Remote access
    title: "Remco logt in via de VIP, met wachtwoord en MFA-code"
    from: controller
    check: contractor-login
    run: "ssh -p 2222 remco@<WAN-IP>  (wachtwoord + TOTP)"
    expect: allowed
    why: "Eén ingang van buiten: de VIP naar de jump host, met een eigen account en een tweede factor."
    logs: [traffic/forward]

  - id: contractor-no-mfa
    group: Remote access
    title: "Gestolen wachtwoord zonder MFA-code"
    from: controller
    check: contractor-no-mfa
    run: "ssh -p 2222 remco@<WAN-IP>  (goed wachtwoord, foute code)"
    expect: blocked
    why: "Een uitgelekt wachtwoord alleen is niet genoeg: de jump host vraagt ook de TOTP-code."

  - id: jump-to-ews
    group: Remote access
    title: "Jump host naar de engineering workstation"
    from: dmz-jump
    run: "tcp 10.20.0.30 22"
    expect: allowed
    why: "Conduit 'DMZ jump -> L2 EWS': de volgende hop van Remco."
    logs: [traffic/forward]

  - id: jump-to-plc
    group: Remote access
    title: "Jump host probeert direct een PLC"
    from: dmz-jump
    run: "modbus-read 10.10.0.10 0 4"
    expect: blocked
    why: "Vanaf de DMZ alleen via de EWS; geen doorsteek naar L1."
    logs: [traffic/forward]

  # --- OT-protocol deep inspection (application control) ------------------
  - id: l3-modbus-read
    group: OT deep inspection
    title: "L3 leest Modbus-registers (read-only conduit)"
    from: probe-ops
    run: "modbus-read 10.10.0.10 0 4"
    expect: allowed
    why: "Policy 'L3->L1 Modbus read-only' staat lezen toe; zichtbaar in app-ctrl log."
    logs: [traffic/forward, app-ctrl]

  - id: l3-modbus-write
    group: OT deep inspection
    title: "L3 schrijft een Modbus-setpoint"
    from: probe-ops
    run: "modbus-write 10.10.0.10 1 999"
    expect: blocked
    why: "Zelfde poort 502, maar het OT-readonly profiel blokkeert write function codes."
    logs: [app-ctrl, traffic/forward]

  - id: opcua-gw-write
    group: OT deep inspection
    title: "OPC UA gateway probeert te schrijven naar PLC"
    from: opcua-gw
    run: "modbus-write 10.10.0.30 1 0"
    expect: blocked
    why: "Gateway heeft alleen een read-only conduit."
    logs: [app-ctrl]

  - id: hmi-write
    group: OT deep inspection
    title: "HMI zet een setpoint (legitiem)"
    from: scada-hmi
    run: "modbus-write 10.10.0.10 1 60"
    expect: allowed
    why: "HMI mag schrijven; FortiGate logt de write wel (audit trail)."
    logs: [app-ctrl]

  - id: s7-stop-unauth
    group: OT deep inspection
    title: "S7 CPU STOP vanaf L3"
    from: probe-ops
    run: "s7-stop 10.10.0.20"
    expect: blocked
    why: "Geen S7-conduit vanaf L3."
    logs: [traffic/forward]

  - id: s7-read-ews
    group: OT deep inspection
    title: "Engineering workstation leest S7 CPU-status"
    from: ews
    run: "s7-read 10.10.0.20"
    expect: allowed
    why: "EWS heeft het engineering-conduit naar L1."
    logs: [app-ctrl]

  - id: shellshock-mes
    group: OT deep inspection
    title: "Ghost valt de MES-webinterface aan (Shellshock)"
    from: dmz-jump
    run: "shellshock http://10.30.0.20/"
    expect: blocked
    why: "Toegestane HTTP-conduit, maar de IPS herkent de exploit: virtual patching voor een ongepatcht systeem."
    logs: [ips]

  - id: break-readonly
    group: OT deep inspection
    title: "Breek het: write-blokkade 60 s uit, Ghost zet het setpoint"
    from: probe-ops
    check: break-readonly
    manual: true
    run: "OT-readonly -> OT-monitor; modbus-write 10.10.0.10 1 999; herstel"
    expect: allowed
    why: "Demo: zonder de write-blokkade loopt de tank over. Policy en setpoint worden daarna hersteld."
    logs: [app-ctrl]

  - id: plc-dos-vpatch
    group: OT deep inspection
    title: "Virtual patching: Force-Listen-Only DoS op de PLC"
    from: controller
    check: plc-dos-vpatch
    manual: true
    run: "modbus-forcelisten 10.10.0.10 zonder -> met virtual patch"
    expect: allowed
    why: "Dezelfde Modbus FC08-aanval: zonder block valt de PLC stil, met de FortiGuard-signature Modbus.TCP.Force.Listen.Only (ID 11521, in de OT-IPS-sensor) wordt hij geblokkeerd. Policy wordt daarna hersteld."
    logs: [ips]

  # --- Uitbraak naar internet ---------------------------------------------
  - id: plc-to-internet
    group: Uitbraak naar internet
    title: "Tank-PLC probeert naar huis te bellen"
    from: plc-tank
    run: "tcp 1.1.1.1 443"
    expect: blocked
    why: "OT-devices hebben geen internet; een C2-verbinding loopt dood op de implicit deny."
    logs: [traffic/forward]

  - id: patch-to-internet
    group: Uitbraak naar internet
    title: "Patch-server haalt updates op"
    from: dmz-patch
    run: "tcp 1.1.1.1 443"
    expect: allowed
    why: "Alleen de patch-server in de DMZ mag naar buiten (HTTP/HTTPS/DNS)."
    logs: [traffic/forward]

  # --- Zichtbaarheid -------------------------------------------------------
  - id: historian-opcua
    group: Zichtbaarheid
    title: "Historian leest OPC UA bij de gateway"
    from: historian
    run: "opcua-browse opc.tcp://10.20.0.20:4840"
    expect: allowed
    why: "Legitieme data-flow L3 <- L2, zichtbaar als OPC UA in application control."
    logs: [app-ctrl]

  - id: asset-inventory
    group: Zichtbaarheid
    title: "FortiGate herkent elk device, in de juiste laag"
    from: controller
    check: assets
    run: "Asset Identity Center vergelijken met de topologie"
    expect: allowed
    why: "Elk device uit de topologie staat in de asset-lijst, met het Purdue-level van zijn segment."
